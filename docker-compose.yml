services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:hoot@db:5432/sistema
      JWT_ACCESS_SECRET: local-access-secret
      JWT_REFRESH_SECRET: local-refresh-secret
      JWT_ACCESS_EXPIRES_IN_SECONDS: 900
      JWT_REFRESH_EXPIRES_IN_SECONDS: 604800
    ports:
      - "3001:3001"
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: sistema
    environment:
      POSTGRES_DB: sistema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hoot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sistema" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
